{% extends 'base.html' %}
{% load static %}

{% block title %}Delete {{ object_type }} - ADOM Institute{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-triangle-exclamation me-2"></i>Confirm deletion</h5>
            </div>
            <div class="card-body">
                <p class="mb-2">Are you sure you want to delete this {{ object_type }}?</p>
                <p class="fw-semibold fs-5">{{ object }}</p>
                <p class="text-danger small">This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ cancel_url }}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-2"></i>Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
