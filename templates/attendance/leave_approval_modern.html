{% extends 'base.html' %}

{% block title %}Review Leave{% endblock %}

{% block content %}
<section class="container-fluid py-3">
    <div class="adom-card p-4">
        <h1 class="h4 mb-3">Review leave request</h1>
        <p class="text-muted">{{ object.reason }}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save review</button>
                <a href="{% url 'attendance:leave_request_detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
