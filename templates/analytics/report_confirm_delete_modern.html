{% extends 'base.html' %}

{% block title %}Delete Report{% endblock %}

{% block content %}
<section class="container-fluid py-3">
    <div class="adom-card p-4">
        <h1 class="h4 mb-2">Delete report</h1>
        <p class="text-muted mb-4">This will remove <strong>{{ report.name }}</strong> from analytics reports.</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete report</button>
            <a href="{% url 'analytics:report_detail' report.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
