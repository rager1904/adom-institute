{% extends 'base.html' %}
{% block title %}AI Consent Preference - ADOM Institute{% endblock %}
{% block content %}
<div class="dashboard-shell">
    <div class="dashboard-header">
        <div><div class="dashboard-kicker">ADOM Institute</div><h1 class="dashboard-title">AI Consent Preference</h1></div>
        <a class="btn btn-outline-secondary" href="{% url 'adom_institute:consent_list' %}">Back</a>
    </div>
    <section class="panel">
        <form method="post" class="row g-3">
            {% csrf_token %}
            {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                </div>
            {% endfor %}
            <div class="col-12"><button class="btn btn-primary" type="submit">Save Preference</button></div>
        </form>
    </section>
</div>
{% endblock %}
