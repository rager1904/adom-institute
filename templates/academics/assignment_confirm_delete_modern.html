{% extends 'base.html' %}

{% block title %}Delete Assignment{% endblock %}

{% block content %}
<section class="container-fluid py-3">
    <div class="adom-card p-4">
        <h1 class="h4 mb-2">Delete assignment</h1>
        <p class="text-muted mb-4">This will remove <strong>{{ object.title }}</strong> and its student submissions from the active workflow.</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete assignment</button>
            <a href="{% url 'academics:assignment_detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
