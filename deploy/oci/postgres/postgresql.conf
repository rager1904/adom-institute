# ADOM Institute - PostgreSQL 16 tuning
# Sized for the Always-Free Ampere A1 VM (2 OCPU / 12 GB) shared with
# Redis, nginx, gunicorn x2, daphne, 2 celery workers.
#
# If you upgrade to a PAYG account and raise the VM (e.g. 4 OCPU / 24 GB),
# scale shared_buffers / effective_cache_size / work_mem proportionally.

listen_addresses = '*'
max_connections = 150

# Memory (modest for a 12 GB host that also runs the app + Redis)
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 128MB
huge_pages = try

# WAL / durability (good balance; backups run at 03:20 daily)
wal_level = replica
max_wal_senders = 3
wal_keep_size = 128MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

# Client connections are fronted by PgBouncer (transaction pooling),
# so 150 direct server connections is plenty.
max_connections = 150
tcp_keepalives_idle = 60
tcp_keepalives_interval = 15

# Queries typical of a school-management workload (many small lookups)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# Autovacuum - keep tables clean for steady performance
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Logging (keep it light in production)
log_timezone = 'UTC'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'